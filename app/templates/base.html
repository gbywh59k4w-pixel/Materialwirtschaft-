<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Materialwirtschaft{% endblock %} – Draht-Lager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark no-print">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">🧵 Draht-Materialwirtschaft</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/materialien">Artikel</a></li>
                <li class="nav-item"><a class="nav-link" href="/auftraege">Aufträge</a></li>
                <li class="nav-item"><a class="nav-link btn btn-outline-light ms-2 px-3" href="/scan">📷 Scannen</a></li>
                <li class="nav-item"><a class="nav-link" href="/bewegungen">Bewegungen</a></li>
                <li class="nav-item"><a class="nav-link" href="/mitarbeiter">Mitarbeiter</a></li>
            </ul>
        </div>
    </div>
</nav>
<main class="container py-4">
    {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
